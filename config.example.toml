# Copy to config.toml (gitignored). Do not commit real chat ids if you care.

timezone = "UTC"
proxy_host = "127.0.0.1"
proxy_port = 40000
session_path = "user.session"
# webhook_url = "https://… from the secretary routine panel"
# Role is TG_HARNESS_ROLE in the agent process, not here.

# [[chats]]
# id = 123456789
# title = "Example group"
# mode = "report"          # report = pull only
#
# [[chats]]
# id = 987654321
# title = "Example friend"
# mode = "secretary"       # secretary = may send
# auto = true              # default send. Set false to draft-and-wait on this chat.

# Event mode: when enabled, secretary watch also wakes on unknown *private* 1:1 DMs
# (not groups/channels, not mode=report chats, not outgoings). Toggle live with:
#   python -m tg_harness.cli event on --name "Meetup Name"
#   python -m tg_harness.cli event off
# Watch reloads [event] on each NewMessage, so strangers wake without restart.
[event]
enabled = false
name = ""

